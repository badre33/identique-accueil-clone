<!doctype html>
<html lang="fr-MA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="google-site-verification" content="xwtvJLZxqZFry58DAgiP2RLBz2VYViF-O0eD4MBGm3g" />

    <!-- ══ SEO PAR ROUTE — title / description / canonical / hreflang / OG /
         Twitter / geo sont injectés au build SSG par <Head> (vite-react-ssg),
         spécifiques à chaque page. index.html ne porte plus de baseline meta
         (sinon doublons). Seul le JSON-LD Organization/LocalBusiness sitewide
         reste ici comme socle. ══ -->

    <!-- ══ SCHEMA.ORG sitewide (Organization + LocalBusiness) ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Link Agency",
          "@id": "https://linkagency.ma/#organization",
          "alternateName": "Link Agency Maroc",
          "legalName": "HARKA STRATEGY CONSULTING SARLAU",
          "url": "https://linkagency.ma",
          "logo": "https://linkagency.ma/og-default.jpg",
          "foundingDate": "2015",
          "description": "Direction marketing externalisée et direction de marque pour entreprises ambitieuses au Maroc. Stratégie, branding, contenu et performance sous un pilotage senior.",
          "telephone": "+212-699-024526",
          "email": "bharkaoui@linkagency.ma",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Casablanca",
            "addressCountry": "MA"
          },
          "areaServed": {"@type": "Country", "name": "Morocco"},
          "sameAs": [
            "https://www.instagram.com/linkagency.ma/",
            "https://www.linkedin.com/company/link-agencyma/",
            "https://www.facebook.com/linkagency.ma"
          ]
        },
        {
          "@type": "ProfessionalService",
          "name": "Link Agency, Casablanca",
          "image": "https://linkagency.ma/og-default.jpg",
          "telephone": "+212-699-024526",
          "email": "bharkaoui@linkagency.ma",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Casablanca",
            "addressCountry": "MA"
          },
          "url": "https://linkagency.ma",
          "areaServed": [
            {"@type": "City", "name": "Casablanca"},
            {"@type": "City", "name": "Rabat"},
            {"@type": "City", "name": "Marrakech"}
          ]
        }
      ]
    }
    </script>

    <!-- ══ PERFORMANCE ══ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" /></noscript>
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/assets/brand/link-agency-logo.png?v=3" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Critical CSS -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;background:#fff;color:#0a0a0a;font-weight:400}
      h1,h2,h3,h4,h5,h6{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:-0.02em}
      #root{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ══ Netlify Forms — static placeholder pour détection au build ══ -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="nom" />
      <input type="text" name="fonction" />
      <input type="email" name="email" />
      <input type="tel" name="telephone" />
      <input type="text" name="entreprise" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <input type="text" name="delai" />
      <textarea name="message"></textarea>
      <textarea name="summary"></textarea>
      <input type="checkbox" name="consent" />
      <input type="hidden" name="landing_page" />
      <input type="hidden" name="referrer_host" />
      <input type="hidden" name="utm_id" />
      <input type="hidden" name="utm_source" />
      <input type="hidden" name="utm_medium" />
      <input type="hidden" name="utm_campaign" />
      <input type="hidden" name="utm_content" />
      <input type="hidden" name="utm_term" />
    </form>
  </body>
</html>
