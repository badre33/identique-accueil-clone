    <!-- ══ Google Analytics 4 — snippet officiel (chargé dans <head> avant React) ══ -->

    <!-- ══ SEO PAR ROUTE — title / description / canonical / hreflang / OG /
         Twitter / geo sont injectés au build SSG par <Head> (vite-react-ssg),
         spécifiques à chaque page. index.html ne porte plus de baseline meta
         (sinon doublons). Seul le JSON-LD Organization/LocalBusiness sitewide
         reste ici comme socle. ══ -->

    <!-- ══ SCHEMA.ORG sitewide (Organization + LocalBusiness) ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Link Agency",
          "alternateName": "Link Agency Maroc",
          "url": "https://linkagency.ma",
          "logo": "https://linkagency.ma/og-default.jpg",
          "foundingDate": "2015",
          "description": "Agence marketing digital au Maroc spécialisée en branding, communication digitale et événementiel corporate.",
          "telephone": "+212-699-024526",
          "email": "bharkaoui@linkagency.ma",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Résidence Azur, 131 Bd d'Anfa",
            "addressLocality": "Casablanca",
            "postalCode": "20000",
            "addressCountry": "MA"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 33.5731,
            "longitude": -7.5898
          },
          "areaServed": {"@type": "Country", "name": "Morocco"},
          "sameAs": [
            "https://www.instagram.com/linkagency.ma",
            "https://www.linkedin.com/company/linkagency",
            "https://www.facebook.com/linkagency.ma"
          ]
        },
        {
          "@type": "LocalBusiness",
          "name": "Link Agency",
          "image": "https://linkagency.ma/og-default.jpg",
          "telephone": "+212-699-024526",
          "email": "bharkaoui@linkagency.ma",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Résidence Azur, 131 Bd d'Anfa",
            "addressLocality": "Casablanca",
            "postalCode": "20000",
            "addressCountry": "MA"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 33.5731,
            "longitude": -7.5898
          },
          "url": "https://linkagency.ma",
          "priceRange": "$$",
          "openingHoursSpecification": [
            {"@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "09:00", "closes": "18:00"},
            {"@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "13:00"}
          ]
        }
      ]
    }
    </script>

    <!-- ══ PERFORMANCE ══ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Critical CSS -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;background:#fff;color:#0a0a0a;font-weight:400}
      h1,h2,h3,h4,h5,h6{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:-0.02em}
      #root{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ══ Netlify Forms — static placeholder pour détection au build ══ -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="nom" />
      <input type="text" name="prenom" />
      <input type="email" name="email" />
      <input type="tel" name="telephone" />
      <input type="text" name="entreprise" />
      <input type="text" name="service" />
      <input type="text" name="budget" />
      <input type="text" name="delai" />
      <textarea name="message"></textarea>
      <textarea name="summary"></textarea>
    </form>
  </body>
